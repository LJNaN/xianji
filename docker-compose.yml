services:
  # ---- Node.js API 后端 ----
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      - DEEPSEEK_KEY=${DEEPSEEK_KEY}
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./server/data:/app/data
      - ./server/images:/app/images
      - ./server/backups:/app/backups
    restart: unless-stopped
    networks:
      default:
      web:
        # 供统一网关按此别名转发 /guitar-api
        aliases:
          - xianji-api

  # ---- Nginx 前端 ----
  # 不再直接占用 80 端口，改为由统一网关（chat 项目的 gateway 服务）转发 /guitar/
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      default:
      web:
        aliases:
          - xianji-web

  # ---- 定时备份 ----
  backup:
    build:
      context: ./server
      dockerfile: Dockerfile.backup
    volumes:
      - ./server/data:/app/data:ro
      - ./server/images:/app/images:ro
      - ./server/backups:/app/backups
    restart: unless-stopped
    depends_on:
      - backend

networks:
  # 与 chat 项目共享的外部网络，需先 docker network create web
  web:
    external: true
