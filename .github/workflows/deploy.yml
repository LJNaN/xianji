name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build check
        run: npm ci && npm run build

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Add server to known_hosts
        run: ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Ensure target directory exists
        run: ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "mkdir -p /app/xianji"

      - name: Sync files via rsync
        run: |
          rsync -avz --delete --exclude='.git' --exclude='node_modules' \
            --exclude='server/node_modules' --exclude='server/data' \
            --exclude='server/images' --exclude='server/backups' \
            --exclude='dist' \
            ./ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/app/xianji/

      - name: Docker compose deploy
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "
            cd /app/xianji &&
            docker compose up --build -d &&
            docker image prune -f
          "
