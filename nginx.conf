server {
    listen 80;
    server_name localhost;

    # 图片上传大小限制
    client_max_body_size 50M;

    # 根路径重定向到 /guitar/
    location = / {
        return 301 /guitar/;
    }

    # /guitar（无尾斜杠）重定向到 /guitar/
    location = /guitar {
        return 301 /guitar/;
    }

    # 前端 SPA（Vite build base = /guitar/）
    location /guitar/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /guitar/index.html;
    }

    # 静态资源缓存（Vite 打包文件带 hash，可长期缓存）
    location /guitar/assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API 反代到后端
    location /guitar-api/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 图片静态资源反代
    location /guitar-images/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Cache-Control "public, max-age=86400";
    }
}
